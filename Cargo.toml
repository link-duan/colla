[workspace]
resolver = "2"
members = ["crates/colla", "crates/colla-wasm"]
default-members = ["crates/colla"]
exclude = ["fuzz"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
repository = "https://github.com/link-duan/colla"

[workspace.dependencies]
colla = { path = "crates/colla", version = "0.3.0" }
