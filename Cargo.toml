[workspace]
resolver = "2"
members = ["crates/colla", "crates/colla-wasm", "conformance/runners/rust"]
default-members = ["crates/colla"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
repository = "https://github.com/link-duan/colla"

[workspace.dependencies]
colla = { path = "crates/colla", version = "0.2.0" }
