[package]
name = "colla"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Immutable path-addressed structured documents with collaborative undo/redo and centralized OT synchronization"
keywords = ["ot", "collaboration", "undo", "rich-text", "sync"]
categories = ["data-structures", "encoding", "text-editors", "wasm"]
documentation = "https://docs.rs/colla"
homepage = "https://link-duan.github.io/colla/"
license.workspace = true
readme = "README.md"
repository.workspace = true

[[bench]]
name = "ot_bench"
harness = false

[dependencies]
cocodec = "0.1"
thiserror = "2"

[dev-dependencies]
proptest = "1"
criterion = "0.8"
serde_json = "1"

[features]
default = []
# Unstable, semver-exempt support for the private `colla-wasm` facade. Not part
# of the public API; never enable it from application crates.
__bindings = []
