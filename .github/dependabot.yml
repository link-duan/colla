version: 2
updates:
  - package-ecosystem: cargo
    directories: ['/', '/fuzz']
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']

  # The pnpm workspace (packages/core and docs-site) is resolved from the root lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dev:
        dependency-type: development
        patterns: ['*']

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
