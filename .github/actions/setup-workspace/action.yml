name: Set up workspace
description: Node, pnpm, stable Rust with the wasm32 target, cached builds, wasm-pack and workspace dependencies.

inputs:
  node-version:
    description: Node.js version.
    default: '24'
  registry-url:
    description: Optional npm registry URL for publishing jobs.
    default: ''
  rust-components:
    description: Extra rustup components, comma separated.
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10.34.5
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.rust-components }}
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
    # Prebuilt binary instead of compiling wasm-pack from source in every job.
    - uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack@0.14.0
    - run: pnpm install --frozen-lockfile
      shell: bash
