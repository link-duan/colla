name: Fuzz

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '1200'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [decode_value, decode_change, ot_algebra]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - run: python3 fuzz/seed.py
      - name: Fuzz ${{ matrix.target }}
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=${{ inputs.seconds || '1200' }}
      - name: Minimize corpus
        if: success()
        run: cargo fuzz cmin --target x86_64-unknown-linux-gnu ${{ matrix.target }}
      # Saved even after a crash so the next run keeps the coverage it reached.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
