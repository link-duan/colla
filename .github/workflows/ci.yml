name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.81.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p colla --lib --locked
      - run: cargo check -p colla-wasm --lib --locked --target wasm32-unknown-unknown

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps
      - run: cargo fmt --all --check

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  javascript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        bundlers:
          - name: minimum
            vite: 5.0.0
            rollup: 4.0.0
            node_resolve: 16.0.0
          - name: latest
            vite: latest
            rollup: latest
            node_resolve: latest
    name: JavaScript (Node ${{ matrix.node }}, ${{ matrix.bundlers.name }})
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm check
      - run: pnpm test:js
        env:
          COLLA_VITE_VERSION: ${{ matrix.bundlers.vite }}
          COLLA_ROLLUP_VERSION: ${{ matrix.bundlers.rollup }}
          COLLA_NODE_RESOLVE_VERSION: ${{ matrix.bundlers.node_resolve }}

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter colla-ot exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # The prebuilt cargo-fuzz is a musl binary that defaults to its own host
      # triple, so every invocation names the glibc target explicitly.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      # Reuse the corpora grown by the scheduled fuzz workflow.
      - uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/decode_value
          key: fuzz-corpus-decode_value-${{ github.run_id }}
          restore-keys: fuzz-corpus-decode_value-
      - uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/decode_change
          key: fuzz-corpus-decode_change-${{ github.run_id }}
          restore-keys: fuzz-corpus-decode_change-
      - uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/ot_algebra
          key: fuzz-corpus-ot_algebra-${{ github.run_id }}
          restore-keys: fuzz-corpus-ot_algebra-
      - run: python3 fuzz/seed.py
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu decode_value -- -max_total_time=60
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu decode_change -- -max_total_time=60
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu ot_algebra -- -max_total_time=60
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  quality-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      - run: pnpm check:versions
      - name: Measure quality baseline
        run: |
          pnpm --filter colla-ot measure \
            --output "$GITHUB_WORKSPACE/artifacts/quality-baseline.json" \
            --markdown-output "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: quality-baseline
          path: artifacts/quality-baseline.json

  benchmarks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Base and head run back to back on the same runner so the comparison is
      # not skewed by hardware differences between jobs.
      - name: Benchmark base
        run: |
          git worktree add "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          cargo bench --manifest-path "$RUNNER_TEMP/base/Cargo.toml" -p colla --bench ot_bench -- --save-baseline base
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - name: Benchmark head
        run: cargo bench -p colla --bench ot_bench -- --baseline-lenient base
      - name: Compare
        run: node scripts/compare-bench.mjs --threshold 0.25 --markdown-output "$GITHUB_STEP_SUMMARY"
