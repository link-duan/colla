# cargo-deny policy, checked in CI by the `cargo-deny` job.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Unmaintained crates and yanked versions are reported for the workspace's own
# dependency graph; ignore entries must name an advisory ID and a reason.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with distributing colla under MIT.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common in transitive dev-dependencies; surface them
# without failing the build.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
